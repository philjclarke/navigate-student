<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" role="img" aria-label="A slide deck">
  <rect width="160" height="90" fill="#0b1f3f"/>
  <circle cx="132" cy="18" r="34" fill="#49b6e0" opacity=".18"/>
  <!-- a slide behind, and the one in front -->
  <g transform="rotate(-6 56 48)">
    <rect x="34" y="20" width="76" height="52" rx="4" fill="#ffffff" opacity=".35"/>
  </g>
  <g transform="rotate(3 80 46)">
    <rect x="44" y="18" width="78" height="54" rx="4" fill="#ffffff"/>
    <rect x="44" y="18" width="78" height="10" rx="4" fill="#49b6e0"/>
    <g fill="#0b1f3f" opacity=".3">
      <rect x="50" y="35" width="40" height="4" rx="2"/>
      <rect x="50" y="44" width="58" height="3" rx="1.5"/>
      <rect x="50" y="51" width="58" height="3" rx="1.5"/>
      <rect x="50" y="58" width="34" height="3" rx="1.5"/>
    </g>
  </g>
</svg>
